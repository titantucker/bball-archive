<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBALL — League Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1720; --panel:#151F2A; --panel2:#1B2733; --line:#26333F;
  --chalk:#F2EEE3; --muted:#8B99A7; --gold:#E8B54A; --maroon:#A34D4D; --wood:#C89B5F;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink); color:var(--chalk); font-family:'Archivo',sans-serif; font-size:15px; line-height:1.5}
.mono{font-family:'IBM Plex Mono',monospace}
.disp{font-family:'Archivo Black',sans-serif; letter-spacing:.02em}
a{color:var(--gold)}
/* ---------- rafters hero ---------- */
header{position:relative; overflow:hidden; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0A1119 0%, var(--ink) 100%)}
.rafter{height:10px; background:repeating-linear-gradient(90deg,#0A1119 0 26px, #131E29 26px 52px); border-bottom:2px solid #060B10}
.banners{display:flex; gap:14px; justify-content:center; align-items:flex-start; padding:0 12px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.banner{flex:0 0 auto; width:92px; text-align:center; color:#F6EAD0; padding:14px 6px 26px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),50% 100%,0 calc(100% - 16px));
  background:linear-gradient(180deg,var(--maroon), #7E3A3A); box-shadow:inset 0 0 0 3px rgba(246,234,208,.25), 0 10px 18px rgba(0,0,0,.35);
  transform-origin:top center}
.banner.gold{background:linear-gradient(180deg,#C99A34,#A87E27); color:#241A05}
.banner.ghost{background:linear-gradient(180deg,#22303C,#1A2530); color:#5C6B79; box-shadow:inset 0 0 0 3px rgba(140,155,170,.18)}
.banner .yr{font-family:'IBM Plex Mono',monospace; font-size:12px; opacity:.85}
.banner .who{font-family:'Archivo Black',sans-serif; font-size:15px; margin-top:2px; text-transform:uppercase}
.banner .tm{font-size:9.5px; margin-top:4px; opacity:.8; line-height:1.25}
@media (prefers-reduced-motion:no-preference){
  .banner{animation:sway 6s ease-in-out infinite alternate}
  .banner:nth-child(2n){animation-delay:-2s}.banner:nth-child(3n){animation-delay:-4s}
  @keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
}
.masthead{max-width:1080px; margin:0 auto; padding:34px 20px 30px; text-align:center}
.masthead h1{font-family:'Archivo Black',sans-serif; font-size:clamp(34px,7vw,64px); line-height:.95; text-transform:uppercase}
.masthead h1 .b{color:var(--gold)}
.masthead p{color:var(--muted); margin-top:10px; font-size:15px}
.statstrip{display:flex; gap:0; justify-content:center; flex-wrap:wrap; margin-top:22px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel)}
.statstrip div{padding:12px 22px; border-right:1px solid var(--line); min-width:130px}
.statstrip div:last-child{border-right:0}
.statstrip .n{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--gold)}
.statstrip .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px}
/* ---------- nav ---------- */
nav{position:sticky; top:0; z-index:50; background:rgba(14,23,32,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line)}
nav .wrap{max-width:1080px; margin:0 auto; display:flex; gap:4px; overflow-x:auto; padding:10px 14px}
nav button{background:none; border:1px solid transparent; color:var(--muted); font:600 13px 'Archivo'; text-transform:uppercase; letter-spacing:.06em; padding:8px 14px; border-radius:999px; cursor:pointer; white-space:nowrap}
nav button:hover{color:var(--chalk)}
nav button.on{color:var(--ink); background:var(--gold); border-color:var(--gold)}
nav button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
main{max-width:1080px; margin:0 auto; padding:30px 16px 80px}
section{display:none}
section.on{display:block}
h2{font-family:'Archivo Black',sans-serif; text-transform:uppercase; font-size:24px; margin:26px 0 6px}
h2:first-child{margin-top:0}
.sub{color:var(--muted); font-size:13.5px; margin-bottom:16px}
/* ---------- tables ---------- */
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th{font:600 11px 'Archivo'; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-size:13px}
td.name{font-family:'Archivo'; font-weight:600; font-size:14px}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(232,181,74,.05)}
.gold-t{color:var(--gold)} .dim{color:var(--muted)}
.trophy{color:var(--gold)}
.pill{display:inline-block; padding:1px 8px; border-radius:999px; font:600 10.5px 'Archivo'; text-transform:uppercase; letter-spacing:.05em}
.pill.champ{background:var(--gold); color:var(--ink)}
.pill.post{border:1px solid var(--maroon); color:#D89090}
/* season chips */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0}
.chips button{background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:8px; font:600 13px 'IBM Plex Mono'; padding:7px 13px; cursor:pointer}
.chips button.on{background:var(--wood); color:var(--ink); border-color:var(--wood)}
.chips button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
/* cards */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px}
.card h3{font-family:'Archivo Black'; text-transform:uppercase; font-size:14px; letter-spacing:.05em; margin-bottom:10px; color:var(--gold)}
.card ol{list-style:none}
.card li{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px}
.card li:last-child{border-bottom:0}
.card li .who{font-weight:600}
.card li .pts{font-family:'IBM Plex Mono'; color:var(--gold)}
.card li .ctx{color:var(--muted); font-size:11.5px}
/* h2h */
.h2h{overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
.h2h table{font-size:11px}
.h2h td,.h2h th{padding:6px 7px; text-align:center}
.h2h th.rowh{text-align:right; position:sticky; left:0; background:var(--panel)}
.h2h td.win{color:#8FD196}.h2h td.loss{color:#E08A8A}.h2h td.even{color:var(--muted)}
/* bracket */
.bracket{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-top:10px}
.game{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px}
.game .rd{font:600 10px 'Archivo'; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px}
.game .row{display:flex; justify-content:space-between; padding:2px 0}
.game .row.w{color:var(--gold); font-weight:600}
/* drafts */
.searchbar{display:flex; gap:10px; margin:12px 0}
.searchbar input{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--chalk); padding:9px 13px; font:14px 'Archivo'}
.searchbar input:focus{outline:2px solid var(--gold)}
.round-lbl{font:600 11px 'Archivo'; text-transform:uppercase; letter-spacing:.08em; color:var(--wood); margin:16px 0 6px}
.picks{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:6px}
.pick{background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:12.5px; display:flex; gap:8px; align-items:baseline}
.pick .no{font-family:'IBM Plex Mono'; color:var(--muted); min-width:30px}
.pick .pos{font:600 10px 'Archivo'; color:var(--wood)}
.pick .to{margin-left:auto; color:var(--muted); font-size:11px; text-align:right}
/* woodlands */
.wood-hero{display:flex; gap:14px; justify-content:center; padding:10px 0 4px}
.note{background:var(--panel); border-left:3px solid var(--wood); border-radius:0 8px 8px 0; padding:14px 16px; color:var(--chalk); font-size:14px; margin:14px 0}
footer{border-top:1px solid var(--line); color:var(--muted); text-align:center; padding:26px 16px; font-size:12.5px}
@media (max-width:640px){ .statstrip div{min-width:105px; padding:10px 14px} }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('league-data').textContent);
const EXTRAS = JSON.parse(document.getElementById('extras-data').textContent);
const YEARS = [2019,2020,2021,2022,2023,2024,2025];
const YEARS_DESC = [...YEARS].reverse();
const fmt = n => n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const FINALS = {2019:['Titan','Cody',149.56,95.76],2020:['Bryce','Cooper',106.54,85.78],2021:['Bryce','Rece',124.20,82.88],2022:['Titan','Cooper',138.06,86.92],2023:['Garrett','Matt',98.92,93.60],2024:['Phoenix','Titan',102.10,100.88],2025:['Matt','The Bussys',137.02,102.50]};
const finalWk = y => (y===2019||y===2020)?16:17;
const CHAMPS = {2019:['Titan','JOE'],2020:['Bryce','brotha mane'],2021:['Bryce','brotha mane'],2022:['Titan','Ghenghis Khan'],2023:['Garrett','Binladen gang'],2024:['Phoenix','Queef'],2025:['Matt','Nips']};

/* ---------- banners ---------- */
(function(){
  const el = document.getElementById('banners');
  let html = '';
  const ALLCH = [[2017,'Matt','Woodlands era<br>inaugural champ'],[2018,'Reed','Woodlands era'],...YEARS.map(y=>[y,CHAMPS[y][0],CHAMPS[y][1]])];
  const seen = {}, goldYr = {};
  [...ALLCH].sort((a,b)=>a[0]-b[0]).forEach(([y,m])=>{ seen[m]=(seen[m]||0)+1; if(seen[m]>=2) goldYr[y]=true; });
  [...ALLCH].sort((a,b)=>b[0]-a[0]).forEach(([y,m,t])=>{
    html += `<div class="banner ${goldYr[y]?'gold':''}"><div class="yr">${y}</div><div class="who">${m}</div><div class="tm">${t}</div></div>`;
  });
  el.innerHTML = html;
})();


/* ---------- nav ---------- */
const TABS = [['rafters','Rafters'],['managers','Managers'],['seasons','Seasons'],['gamecenter','Game Center'],['records','Record Book'],['storylines','Storylines'],['hof','Hall of Fame'],['drafts','Draft Vault'],['draftw','Draft Day Warriors'],['woodlands','Woodlands']];
const navEl = document.getElementById('nav');
navEl.innerHTML = TABS.map(([id,l])=>`<button data-t="${id}">${l}</button>`).join('');
navEl.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  show(b.dataset.t);
});
function show(id){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===id));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on', s.id==='sec-'+id));
  window.scrollTo({top:0});
}

/* ---------- RAFTERS (overview) ---------- */
(function(){
  const M = DATA.managers;
  const podium = Object.entries(M).filter(([,v])=>v.titles.length).sort((a,b)=>b[1].titles.length-a[1].titles.length);
  let html = `<h2>Championship ledger</h2><div class="sub">Rings, near-misses, and who still owes the league a title.</div>
  <div class="tblwrap"><table><thead><tr><th>Manager</th><th>🏆 Titles</th><th>Runner-up</th><th>3rd</th><th>Seasons</th></tr></thead><tbody>`;
  const all = Object.entries(M).sort((a,b)=> (b[1].titles.length-a[1].titles.length) || (b[1].runner.length-a[1].runner.length) || (b[1].seasons-a[1].seasons));
  all.forEach(([m,v])=>{
    const yl = (y,f)=> FINALS[y]? `<span class="gcrow yl ${f==='r'?'silver':''}" data-gcm="${y}.${finalWk(y)}.${FINALS[y][0]}.${FINALS[y][1]}" data-f="${f==='r'?FINALS[y][1]:FINALS[y][0]}" title="Open the title game">${f==='t'?'🏆':f==='r'?'🥈':''}${y}</span>` : `<span class="${f==='r'?'silver':''}">${f==='t'?'🏆':f==='r'?'🥈':''}${y}</span>`;
    html += `<tr><td class="name">${m}</td>
      <td>${v.titles.length? '<span class="trophy">'+v.titles.map(y=>yl(y,'t')).join(' ')+'</span>':'<span class="dim">—</span>'}</td>
      <td>${v.runner.length? v.runner.map(y=>yl(y,'r')).join(' '):'<span class="dim">—</span>'}</td>
      <td>${v.third.length? v.third.map(y=>`<span class="gcrow yl bronze" data-gcm1="${y}.${finalWk(y)}.${m}" title="Open the 3rd place game">🥉${y}</span>`).join(' '):'<span class="dim">—</span>'}</td>
      <td>${v.seasons}</td></tr>`;
  });
  html += '</tbody></table></div>';
  // The Basement — regular season last place (the league's real loser)
  html += `<h2>The Basement</h2><div class="sub">This league ignores the toilet bowl — the real loser of a season is whoever finished last in the regular season. Honor them.</div>
  <div class="tblwrap"><table><thead><tr><th>Year</th><th>Regular season loser</th><th>Manager</th><th>Record</th></tr></thead><tbody>`;
  YEARS_DESC.forEach(y=>{
    const rows = DATA.seasons[y].rows;
    const last = rows.reduce((a,b)=> b.rank>a.rank? b:a);
    html += `<tr><td>${y}</td><td class="name">${last.team}</td><td>${last.mgr}</td><td>${last.w}-${last.l}-${last.t}</td></tr>`;
  });
  html += '</tbody></table></div>';
  html += `<h2>How each title was won</h2><div class="sub">Fantasy Super Bowl results, newest first.</div><div class="bracket">`;
  const F = FINALS;
  YEARS_DESC.forEach(y=>{
    const [c,r,cs,rs] = F[y];
    const cwk = (y===2019||y===2020)?16:17;
    html += `<div class="game gcrow" data-gcm="${y}.${cwk}.${c}.${r}" data-f="${c}" title="Open box score"><div class="rd">${y} · Fantasy Super Bowl</div>
      <div class="row w"><span>${c}</span><span>${fmt(cs)}</span></div>
      <div class="row"><span>${r}</span><span>${fmt(rs)}</span></div></div>`;
  });
  html += `<div class="game" style="opacity:.7"><div class="rd">2018 · Woodlands Super Bowl</div>
      <div class="row w"><span>Reed</span><span class="dim">score lost to history</span></div></div>
    <div class="game" style="opacity:.7"><div class="rd">2017 · Woodlands Super Bowl</div>
      <div class="row w"><span>Matt</span><span class="dim">score lost to history</span></div></div>`;
  html += '</div>';
  document.getElementById('sec-rafters').innerHTML = html;
})();

/* ---------- MANAGERS ---------- */
(function(){
  const M = DATA.managers;
  const rows = Object.entries(M).map(([m,v])=>{
    const gp = v.w+v.l+v.t;
    const ps = (DATA.postseason.table[m]) || {apps:0,w:0,l:0,titles:[],finals:[]};
    return {m, ...v, gp, ps, pct: gp? (v.w+0.5*v.t)/gp : 0, pfg: gp? v.pf/gp : 0};
  }).sort((a,b)=> b.pct-a.pct);
  let html = `<h2>All-time table</h2><div class="sub">Combined record across all games; PF/G = points per game. Playoff W-L counts championship-path games only (QF · SF · Final) — no 3rd/5th place games, no consolation. Sorted by win percentage.</div>
  <div class="tblwrap"><table><thead><tr><th>Manager</th><th>Yrs</th><th>W-L-T</th><th>Pct</th><th>PF/G</th><th>Playoff W-L</th><th>Best week</th><th>🏆</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    html += `<tr><td class="name">${r.m}</td><td>${r.seasons}</td><td>${r.w}-${r.l}-${r.t}</td>
      <td>${r.pct.toFixed(3).slice(1)}</td><td>${r.pfg.toFixed(1)}</td>
      <td>${r.ps.w}-${r.ps.l}</td><td class="gcrow" data-gcm1="${r.best_wk[1]}.${r.best_wk[2]}.${r.m}" title="Open box score">${fmt(r.best_wk[0])} <span class="dim">'${String(r.best_wk[1]).slice(2)} Week ${r.best_wk[2]}</span></td>
      <td>${r.titles.length? '<span class="trophy">'+'🏆'.repeat(r.titles.length)+'</span>':'<span class="dim">—</span>'}</td></tr>`;
  });
  html += `</tbody></table></div>
  <h2>Postseason ledger</h2><div class="sub">Real playoff games only — the winner had to advance or lift the trophy. 5th place games, 3rd place games, and the entire toilet bowl do not exist here. First-round byes count as nothing in the W-L (but we count the byes themselves — a top-2 seed is a flex). 4th place = lost the 3rd-place game (lowkey still impressive). Woodlands titles (Matt ’17, Reed ’18) credited as 2-0 runs — three-round bracket, first-round bye, opponents lost to history.</div>
  <div class="tblwrap"><table><thead><tr><th>Manager</th><th>Berths</th><th>1st-rd byes</th><th>Playoff W-L</th><th>Title games</th><th>Titles</th><th>4th place</th><th>Berth years</th></tr></thead><tbody>`;
  Object.entries(DATA.postseason.table).sort((a,b)=> (b[1].w-a[1].w) || (b[1].titles.length-a[1].titles.length)).forEach(([m,v])=>{
    const by = EXTRAS.byes[m]||[], fo = EXTRAS.fourth[m]||[];
    html += `<tr><td class="name">${m}</td><td>${v.apps}</td>
      <td>${by.length? `${by.length} <span class="dim">(${by.map(y=>"'"+String(y).slice(2)).join(' ')})</span>`:'<span class="dim">—</span>'}</td>
      <td>${v.w}-${v.l}</td>
      <td>${v.finals.length? v.finals.join(', '):'<span class="dim">—</span>'}</td>
      <td>${v.titles.length? '<span class="trophy">'+v.titles.map(y=>'🏆'+y).join(' ')+'</span>':'<span class="dim">—</span>'}</td>
      <td>${fo.length? fo.map(y=>`<span class="gcrow yl bronze" data-gcm1="${y}.${finalWk(y)}.${m}" title="Open the 3rd place game">${y}</span>`).join(' '):'<span class="dim">—</span>'}</td>
      <td class="dim">${v.years.join(', ')}</td></tr>`;
  });
  html += `</tbody></table></div>
  <h2>Head-to-head</h2><div class="sub">All games, all eras — read across: that manager's wins vs each opponent. Green = winning record.</div>`;
  const names = Object.keys(M).sort((a,b)=> (M[b].w+M[b].l) - (M[a].w+M[a].l));
  const abbr = n => n.replace(/^The /,'').slice(0,4);
  html += `<div class="h2h"><table><thead><tr><th class="rowh"></th>${names.map(n=>`<th title="${n}">${abbr(n)}</th>`).join('')}</tr></thead><tbody>`;
  names.forEach(a=>{
    html += `<tr><th class="rowh">${a}</th>`;
    names.forEach(b=>{
      if(a===b){ html += '<td class="dim">·</td>'; return; }
      const key = a<b? a+'|'+b : b+'|'+a;
      const rec = DATA.h2h[key];
      if(!rec){ html += '<td class="dim">—</td>'; return; }
      const [x,y2] = a<b? [rec[0],rec[1]] : [rec[1],rec[0]];
      const cls = x>y2?'win': x<y2?'loss':'even';
      html += `<td class="${cls}">${x}-${y2}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('sec-managers').innerHTML = html;
})();

/* ---------- SEASONS ---------- */
(function(){
  const el = document.getElementById('sec-seasons');
  let html = `<h2>Season archive</h2><div class="sub">Final regular-season standings, the playoff run, and every week's scores.</div>
  <div class="chips" id="szn-chips">${YEARS_DESC.map(y=>`<button data-y="${y}">${y}</button>`).join('')}</div><div id="szn-body"></div>`;
  el.innerHTML = html;
  el.querySelector('#szn-chips').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    el.querySelectorAll('#szn-chips button').forEach(x=>x.classList.toggle('on', x===b));
    renderSeason(+b.dataset.y);
  });
  function renderSeason(y){
    const S = DATA.seasons[y];
    let h = `<div class="sub" style="margin-top:4px">${S.platform} era · Champion: <b class="gold-t">${S.champ}</b> over ${S.runner} (${fmt(S.final[0])}–${fmt(S.final[1])}) · 3rd: ${S.third}</div>`;
    h += `<div class="tblwrap"><table><thead><tr><th>#</th><th>Team</th><th>Manager</th><th>W-L-T</th><th>PF</th><th>PA</th><th></th></tr></thead><tbody>`;
    S.rows.forEach(r=>{
      const champ = r.mgr===S.champ;
      h += `<tr><td>${r.rank}</td><td class="name">${r.team}</td><td>${r.mgr}</td><td>${r.w}-${r.l}-${r.t}</td>
        <td>${fmt(r.pf)}</td><td>${fmt(r.pa)}</td><td>${champ?'<span class="pill champ">Champion</span>':''}</td></tr>`;
    });
    h += '</tbody></table></div>';
    // playoffs
    const P = DATA.playoffs[y];
    if(P && P.seeds){
      h += `<h2 style="font-size:18px">Playoff bracket</h2><div class="bracket">`;
      const rounds = [['championship_w17','🏆 Fantasy Super Bowl'],['championship_w16','🏆 Fantasy Super Bowl'],['semifinals_w16','Semifinal'],['semifinals_w15','Semifinal'],['quarterfinals_w15','Quarterfinal'],['quarterfinals_w14','Quarterfinal'],['third_place_w17','3rd Place'],['third_place_w16','3rd Place'],['fifth_place_w17','5th Place'],['fifth_place_w16','5th Place']];
      rounds.forEach(([k,label])=>{
        if(!P[k]) return;
        const gs = Array.isArray(P[k][0]) ? P[k] : [P[k]];
        gs.forEach(g=>{
          const pwk = +k.split('_w')[1];

/* ---------- DRAFT VAULT ---------- */
(function(){
  const el = document.getElementById('sec-drafts');
  el.innerHTML = `<h2>Draft vault</h2><div class="sub">All 1,260 picks, 2019–2025. Pick a year or search a player across every draft.</div>
    <div class="chips" id="dr-chips">${YEARS_DESC.map(y=>`<button data-y="${y}">${y}</button>`).join('')}</div>
    <div class="searchbar"><input id="dr-q" type="search" placeholder="Search any player across all drafts (e.g. Saquon)…" aria-label="Search drafts"></div>
    <div id="dr-body"></div>`;
  const parse = y => DATA.drafts[y].split(';').map(p=>{
    const [no,player,pos,team] = p.split('|'); return {no:+no, player, pos, team, y:+y};
  });
  const ALL = YEARS.flatMap(y=>parse(y));
  function renderYear(y){
    const picks = parse(y);
    let h = '';
    for(let r=0;r<15;r++){
      const rd = picks.slice(r*12,(r+1)*12);
      if(!rd.length) continue;
      h += `<div class="round-lbl">Round ${r+1}</div><div class="picks">`;
      rd.forEach(p=>{ h += `<div class="pick"><span class="no">${p.no}</span><span>${p.player}</span><span class="pos">${p.pos}</span><span class="to">${p.team}</span></div>`; });
      h += '</div>';
    }
    document.getElementById('dr-body').innerHTML = h;
  }
  function renderSearch(q){
    const hits = ALL.filter(p=>p.player.toLowerCase().includes(q)).slice(0,120);
    let h = `<div class="round-lbl">${hits.length} result${hits.length===1?'':'s'}</div><div class="picks">`;
    hits.forEach(p=>{ h += `<div class="pick"><span class="no">${p.y}</span><span>${p.player}</span><span class="pos">${p.pos}</span><span class="to">#${p.no} → ${p.team}</span></div>`; });
    h += '</div>';
    document.getElementById('dr-body').innerHTML = h;
  }
  el.querySelector('#dr-chips').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    el.querySelectorAll('#dr-chips button').forEach(x=>x.classList.toggle('on', x===b));
    document.getElementById('dr-q').value=''; renderYear(+b.dataset.y);
  });
  document.getElementById('dr-q').addEventListener('input', e=>{

<script>
(function(){
const ROSTERS = JSON.parse(document.getElementById('roster-data').textContent);
const GAMES = DATA.games;
const YEARS = [2025,2024,2023,2022,2021,2020,2019];
const poStart = y => (y===2019||y===2020) ? 14 : 15;
let curY = 2025, curW = 1;

const el = document.getElementById('sec-gamecenter');
el.innerHTML = `<h1 class="disp">Game Center</h1>
  <div class="sub">Every matchup, every lineup, 2019 → today. Pick a season and week — tap any game for the full box score.</div>
  <div class="chips" id="gc-years">${YEARS.map(y=>`<button data-y="${y}">${y}</button>`).join('')}</div>
  <div class="gc-weeks" id="gc-weeks"></div><div id="gc-body"></div>
  <div id="gc-modal"><div class="gc-box" id="gc-boxin"></div></div>`;
document.body.appendChild(document.getElementById('gc-modal'));

function weeksOf(y){ const s=new Set(); GAMES.forEach(g=>{if(g.y===y)s.add(g.wk)}); if(ROSTERS[y]) Object.keys(ROSTERS[y]).forEach(w=>s.add(+w)); return [...s].sort((a,b)=>a-b); }
function gamesAt(y,w){ return GAMES.filter(g=>g.y===y&&g.wk===w); }
function rline(y,w,ta,tb){ const L=(ROSTERS[y]&&ROSTERS[y][w])||[]; for(const ln of L){ const p=ln.split('|'); const na=p[0].split('~')[0], nb=(p[1]||'').split('~')[0]; if((na===ta&&nb===tb)||(na===tb&&nb===ta)) return ln; } return null; }
function idleLines(y,w){ const L=(ROSTERS[y]&&ROSTERS[y][w])||[]; const gs=gamesAt(y,w); const busy=new Set(); gs.forEach(g=>{busy.add(g.ta);busy.add(g.tb)}); return L.filter(ln=>{const n=ln.split('|')[0].split('~')[0]; return !busy.has(n);}); }
function parseRoster(str){ return str.split(';').filter(Boolean).map(e=>{ const t=e.split(' ').filter(Boolean); const slot=t[0], pts=t[t.length-1]; let name,pos; if(t.length>=4){pos=t[t.length-2]; name=t.slice(1,t.length-2).join(' ');} else {name=t[1]||'—'; pos='';} return {slot,name,pos,pts:parseFloat(pts)||0}; }); }
const START=new Set(['QB','RB','WR','TE','W/R','K','DEF']);

function renderWeeks(){
  const ws=weeksOf(curY);
  if(!ws.includes(curW)) curW=ws[0];
  document.getElementById('gc-weeks').innerHTML = ws.map(w=>`<button data-w="${w}" class="${w>=poStart(curY)?'po':''} ${w===curW?'on':''}">Week ${w}</button>`).join('');
}
const RORD={Championship:0,Semifinal:1,Quarterfinal:2};
function roundOf(y,w,g){
  const base=(y===2019||y===2020)?13:14;
  const pg=DATA.postseason.games.find(p=>p.y===y && (base+RORD2W[p.rd])===w && ((p.w===g.a&&p.l===g.b)||(p.w===g.b&&p.l===g.a)));
  return pg? pg.rd : null;
}
const RORD2W={Quarterfinal:1,Semifinal:2,Championship:3};
function renderBody(){
  const gs=gamesAt(curY,curW); const po=curW>=poStart(curY);
  const anns=gs.map((g,i)=>({g,i,rd:po?roundOf(curY,curW,g):null}));
  anns.sort((a,b)=>((a.rd!=null?RORD[a.rd]:9)-(b.rd!=null?RORD[b.rd]:9))||(a.i-b.i));
  let h=`<div class="gc-grid">`;
  anns.forEach(({g,i,rd})=>{ const aw=g.pa>g.pb;
    const tag = rd? `<span class="rdtag${rd==='Championship'?' champ':''}">${rd==='Championship'?'🏆 Championship':rd}</span>` : (po? `<span class="rdtag cons">Consolation</span>`:'');
    h+=`<div class="gc-card${rd?' path':''}${rd==='Championship'?' chipg':''}${po&&!rd?' cons':''}" data-open="${i}"><div class="lbl">${curY} · Week ${curW}${tag?' · ':''}${tag}</div>
      <div class="tm ${aw?'w':''}"><span class="n">${g.ta}<span class="m">${g.a}</span></span><span class="s">${g.pa.toFixed(2)}</span></div>
      <div class="tm ${!aw?'w':''}"><span class="n">${g.tb}<span class="m">${g.b}</span></span><span class="s">${g.pb.toFixed(2)}</span></div></div>`; });
  idleLines(curY,curW).forEach((ln,i)=>{ const nm=ln.split('|')[0].split('~')[0];
    h+=`<div class="gc-card idle" data-idle="${i}"><div class="lbl">${curY} · Week ${curW} · Idle (bye)</div>
      <div class="tm"><span class="n">${nm}</span><span class="s">—</span></div>
      <div class="tm"><span class="n" style="color:var(--muted)">On bye — tap to view roster</span></div></div>`; });
  if(curY===2025 && po){
    const all=new Set(); (ROSTERS[2025]&&ROSTERS[2025]['1']||[]).forEach(ln=>ln.split('|').forEach(s=>{const n=s.split('~')[0]; if(n&&n!=='BYE') all.add(n);}));
    const busy=new Set(); gs.forEach(g=>{busy.add(g.ta);busy.add(g.tb)});
    [...all].filter(t=>!busy.has(t)).forEach(nm=>{
      h+=`<div class="gc-card idle" style="cursor:default"><div class="lbl">${curY} · Week ${curW} · Idle</div>
        <div class="tm"><span class="n">${nm}</span><span class="s">—</span></div>
        <div class="tm"><span class="n" style="color:var(--muted)">${curW===15?'First-round / consolation bye — no matchup':'Season complete — no matchup'}</span></div></div>`;
    });
  }
  h+='</div>';
  if(curY===2025 && !(ROSTERS[2025]&&ROSTERS[2025][curW])) h+=`<div class="note" style="margin-top:12px">2025 Week ${curW} lineups are on the way from Sleeper — scores are final.</div>`;
  document.getElementById('gc-body').innerHTML=h;
}
function teamTable(name,mgr,roster,score,win,isBye){
  let rows='', tot=0;
  if(isBye) return `<div class="gc-team"><div class="hd"><span class="n">BYE</span><span class="s">—</span></div><table><tr><td style="color:var(--muted);padding:16px 14px">No opponent this week.</td></tr></table></div>`;
  if(!roster) return `<div class="gc-team ${win?'win':''}"><div class="hd"><span class="n">${name}<span class="m">${mgr||''}</span></span><span class="s">${score!=null?score.toFixed(2):''}</span></div><table><tr><td style="color:var(--muted);padding:16px 14px">Lineup not yet imported.</td></tr></table></div>`;
  const ps=parseRoster(roster); const best=Math.max(...ps.filter(p=>START.has(p.slot)).map(p=>p.pts));
  ps.forEach(p=>{ const st=START.has(p.slot); if(st) tot+=p.pts;
    rows+=`<tr class="${st?(p.pts===best&&p.pts>0?'top':''):'bench'}"><td class="sl">${p.slot}</td><td>${p.name}${p.pos&&p.pos!==p.slot?' <span style="color:var(--muted);font-size:11px">'+p.pos+'</span>':''}</td><td class="pt">${p.pts.toFixed(2)}</td></tr>`; });
  rows+=`<tr class="tot"><td class="sl"></td><td>Total</td><td class="pt">${tot.toFixed(2)}</td></tr>`;
  return `<div class="gc-team ${win?'win':''}"><div class="hd"><span class="n">${name}<span class="m">${mgr||''}</span></span><span class="s">${(score!=null?score:tot).toFixed(2)}</span></div><table>${rows}</table></div>`;
}
const POSC={QB:'#E15B8D',RB:'#3FBFA8',WR:'#4D9DE0',TE:'#E8933F',K:'#9B7EDE','W/R':'#8A6FD1',DEF:'#7C8B9A',BN:'#55636F',RES:'#8A5252'};
function slotBadge(s){ return `<span class="sbadge" style="background:${POSC[s]||'#55636F'}">${s==='W/R'?'FLX':s}</span>`; }
function matchTable(g,ra,rb,focus){
  const A=parseRoster(ra), B=parseRoster(rb);
  const as=A.filter(p=>START.has(p.slot)), bs=B.filter(p=>START.has(p.slot));
  const ab=A.filter(p=>!START.has(p.slot)), bb=B.filter(p=>!START.has(p.slot));
  const aw=g.pa>g.pb, fa=focus&&focus===g.a, fb=focus&&focus===g.b;
  const row=(pa,pb,slot,bench)=>{
    const l=pa||{name:'—',pos:'',pts:null}, r2=pb||{name:'—',pos:'',pts:null};
    const lw=l.pts!=null&&r2.pts!=null&&l.pts>r2.pts, rw=l.pts!=null&&r2.pts!=null&&r2.pts>l.pts;
    return `<tr class="${bench?'bench':''}">
      <td class="pl l"><div class="nm">${l.name}</div><div class="ps">${l.pos||''}</div></td>
      <td class="pt l${lw?' hi':''}">${l.pts!=null?l.pts.toFixed(2):''}</td>
      <td class="mid">${slotBadge(slot)}</td>
      <td class="pt r${rw?' hi':''}">${r2.pts!=null?r2.pts.toFixed(2):''}</td>
      <td class="pl r"><div class="nm">${r2.name}</div><div class="ps">${r2.pos||''}</div></td></tr>`;
  };
  let rows='';
  for(let i=0;i<Math.max(as.length,bs.length);i++) rows+=row(as[i],bs[i],(as[i]||bs[i]).slot,false);
  if(ab.length||bb.length){
    rows+=`<tr class="sep"><td colspan="5">Bench</td></tr>`;
    for(let i=0;i<Math.max(ab.length,bb.length);i++) rows+=row(ab[i],bb[i],(ab[i]||bb[i]).slot,true);
  }
  return `<div class="mx">
    <div class="mx-hd">
      <div class="mx-t l${aw?' w':''}${fa?' foc':''}"><div class="tn">${g.ta}</div><div class="tm2">${g.a}</div><div class="ts">${g.pa.toFixed(2)}</div></div>
      <div class="mx-vs">FINAL</div>
      <div class="mx-t r${!aw?' w':''}${fb?' foc':''}"><div class="tn">${g.tb}</div><div class="tm2">${g.b}</div><div class="ts">${g.pb.toFixed(2)}</div></div>
    </div>
    <table class="mx-tbl${fa?' fL':''}${fb?' fR':''}">${rows}</table></div>`;
}
function openBox(i,focus){
  const gs=gamesAt(curY,curW); const g=gs[i]; if(!g) return;
  const po=curW>=poStart(curY);
  const rd = po? roundOf(curY,curW,g) : null;
  const ln=rline(curY,curW,g.ta,g.tb);
  let ra=null, rb=null;
  if(ln){ const p=ln.split('|'); const [n1,r1]=[p[0].split('~')[0],p[0].split('~').slice(1).join('~')]; const [n2,r2]=[(p[1]||'').split('~')[0],(p[1]||'').split('~').slice(1).join('~')]; if(n1===g.ta){ra=r1;rb=r2;} else {ra=r2;rb=r1;} }
  const aw=g.pa>g.pb;
  const body = (ra&&rb)? matchTable(g,ra,rb,focus)
    : `<div class="gc-cols">${teamTable(g.ta,g.a,ra,g.pa,aw)}${teamTable(g.tb,g.b,rb,g.pb,!aw)}</div>`;
  document.getElementById('gc-boxin').innerHTML = `<button class="gc-close" data-x>✕</button>
    <h3>${g.ta} ${aw?'def.':'vs'} ${g.tb}</h3>
    <div class="sub2">${curY} · Week ${curW}${rd? ' · '+(rd==='Championship'?'🏆 Championship':rd) : (po?' · Playoffs':'')} · ${g.a} vs ${g.b} · Final ${g.pa.toFixed(2)}–${g.pb.toFixed(2)}</div>
    ${body}
    <div class="gc-navbtns"><button data-nav="-1">← Prev game</button><button data-navw="-1">« Prev week</button><button data-navw="1">Next week »</button><button data-nav="1">Next game →</button></div>`;
  document.getElementById('gc-modal').classList.add('open'); document.getElementById('gc-modal').dataset.i=i; document.getElementById('gc-modal').dataset.mode='g';
  history.replaceState(null,'','#gc/'+curY+'/'+curW+'/'+i);
}
function openIdle(i){
  const ln=idleLines(curY,curW)[i]; if(!ln) return;
  const nm=ln.split('|')[0].split('~')[0]; const r=ln.split('|')[0].split('~').slice(1).join('~');
  document.getElementById('gc-boxin').innerHTML=`<button class="gc-close" data-x>✕</button><h3>${nm} — idle week</h3>
    <div class="sub2">${curY} · Week ${curW} · Playoff bye / eliminated</div><div class="gc-cols">${teamTable(nm,'',r,null,false)}${teamTable('','',null,null,false,true)}</div>
    <div class="gc-navbtns"><button data-navw="-1">« Prev week</button><button data-navw="1">Next week »</button></div>`;
  document.getElementById('gc-modal').classList.add('open'); document.getElementById('gc-modal').dataset.mode='i';
}
function go(y,w){ curY=y; renderWeeks(); if(w&&weeksOf(y).includes(w)) curW=w; renderWeeks(); renderBody();
  document.querySelectorAll('#gc-years button').forEach(b=>b.classList.toggle('on', +b.dataset.y===curY)); }

el.querySelector('#gc-years').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ go(+b.dataset.y); history.replaceState(null,'','#gc/'+curY+'/'+curW);} });
el.querySelector('#gc-weeks').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ curW=+b.dataset.w; renderWeeks(); renderBody(); history.replaceState(null,'','#gc/'+curY+'/'+curW);} });
el.querySelector('#gc-body').addEventListener('click',e=>{ const c=e.target.closest('.gc-card'); if(!c) return; if(c.dataset.open!==undefined&&c.dataset.open!=='') openBox(+c.dataset.open); else if(c.dataset.idle!==undefined) openIdle(+c.dataset.idle); });
document.getElementById('gc-modal').addEventListener('click',e=>{
  const m=document.getElementById('gc-modal');
  if(e.target.dataset.x!==undefined||e.target===m){ m.classList.remove('open'); return; }
  const nav=e.target.dataset.nav, navw=e.target.dataset.navw;
  if(nav){ const gs=gamesAt(curY,curW); let i=(+m.dataset.i)+(+nav); if(i<0)i=gs.length-1; if(i>=gs.length)i=0; openBox(i); }
  if(navw){ const ws=weeksOf(curY); let ix=ws.indexOf(curW)+(+navw); if(ix<0)ix=0; if(ix>=ws.length)ix=ws.length-1; curW=ws[ix]; renderWeeks(); renderBody(); openBox(0); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('gc-modal').classList.remove('open'); });

// clickable rows elsewhere (week-by-week + brackets in Seasons tab)
document.addEventListener('click',e=>{
  const r=e.target.closest('.gcrow'); if(!r) return;
  let y,w,i,f=r.dataset.f||null;
  if(r.dataset.gc){ [y,w,i]=r.dataset.gc.split('.'); y=+y;w=+w;i=+i; }
  else if(r.dataset.gcm){ const p=r.dataset.gcm.split('.'); y=+p[0]; w=+p[1]; const A=p[2],B=p[3]; const gs=GAMES.filter(g=>g.y===y&&g.wk===w); i=gs.findIndex(g=>(g.a===A&&g.b===B)||(g.a===B&&g.b===A)); if(i<0) return; }
  else if(r.dataset.gcm1){ const p=r.dataset.gcm1.split('.'); y=+p[0]; w=+p[1]; const M=p[2]; const gs=GAMES.filter(g=>g.y===y&&g.wk===w); i=gs.findIndex(g=>g.a===M||g.b===M); if(i<0) return; if(!f) f=M; }
  else return;
  go(y,w); openBox(i,f);
});

// hash deep-link
function fromHash(){ const m=location.hash.match(/^#gc\/(\d{4})\/(\d+)(?:\/(\d+))?/); if(!m) return false;
  show('gamecenter'); go(+m[1],+m[2]); if(m[3]!==undefined) openBox(+m[3]); return true; }
window.addEventListener('hashchange',fromHash);
go(2025,1); if(!fromHash()){ /* default view stays hidden until tab chosen */ }
})();
</script>

</body>
